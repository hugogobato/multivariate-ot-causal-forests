[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdcf"
version = "0.1.0"
description = "Fixed-count multivariate distributional causal forest prototype"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "scikit-learn", "POT"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mdcf = ["forest_bridge.R"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
